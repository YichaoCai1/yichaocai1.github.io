<div id="yc-publication-concept" aria-label="Publication page design" data-treatment="soft" data-density="comfortable">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap");
    #yc-publication-concept {
      --pub-bg: light-dark(#ffffff, #191b1e);
      --pub-fg: light-dark(#202124, #e5e7eb);
      --pub-muted: light-dark(#62666b, #a8afb8);
      --pub-line: light-dark(#e4e6e8, #353a42);
      --pub-accent: light-dark(#1772d0, #81b9f0);
      --pub-soft: light-dark(#f6f8fa, #202328);
      --pub-selected: light-dark(#fff6ce, #343124);
      --pub-selected-fg: light-dark(#755a12, #e7ce80);
      background: var(--pub-bg);
      color: var(--pub-fg);
      font:
        400 14px/1.6 Lato,
        "Noto Sans SC",
        Verdana,
        sans-serif;
      width: 100%;
      overflow-wrap: anywhere;
    }
    #yc-publication-concept * {
      box-sizing: border-box;
    }
    #yc-publication-concept a {
      color: var(--pub-accent);
      text-decoration: none;
    }
    #yc-publication-concept a:hover {
      text-decoration: underline;
    }
    #yc-publication-concept .pub-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 24px;
      padding: 18px 30px;
      border-bottom: 1px solid var(--pub-line);
    }
    #yc-publication-concept .pub-brand {
      margin-right: auto;
      font-size: 16px;
    }
    #yc-publication-concept .pub-nav nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 13px;
    }
    #yc-publication-concept .pub-nav [aria-current] {
      color: var(--pub-accent);
      text-decoration: underline;
      text-underline-offset: 6px;
    }
    #yc-publication-concept .pub-main {
      max-width: 960px;
      margin: auto;
      padding: 32px 30px;
    }
    #yc-publication-concept .pub-concept {
      color: var(--pub-muted);
      font-size: 12px;
      margin: 0 0 6px;
    }
    #yc-publication-concept h1 {
      font-size: 30px;
      font-weight: 400;
      line-height: 1.25;
      margin: 0 0 10px;
    }
    #yc-publication-concept .pub-description {
      margin: 0 0 22px;
      color: var(--pub-muted);
    }
    #yc-publication-concept .pub-tools {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    #yc-publication-concept .pub-search-label {
      flex: 1 1 230px;
    }
    #yc-publication-concept label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--pub-muted);
    }
    #yc-publication-concept input,
    #yc-publication-concept select {
      width: 100%;
      min-width: 0;
      color: var(--pub-fg);
      background: var(--pub-bg);
      border: 1px solid var(--pub-line);
      border-radius: 4px;
      padding: 9px 11px;
      font: inherit;
      font-size: 14px;
    }
    #yc-publication-concept .pub-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
    }
    #yc-publication-concept button {
      font: inherit;
      cursor: pointer;
    }
    #yc-publication-concept .pub-chip {
      color: var(--pub-muted);
      background: var(--pub-bg);
      border: 1px solid var(--pub-line);
      border-radius: 4px;
      padding: 4px 9px;
      font-size: 12px;
    }
    #yc-publication-concept .pub-chip[aria-pressed="true"] {
      background: var(--pub-accent);
      color: var(--pub-bg);
      border-color: var(--pub-accent);
    }
    #yc-publication-concept .pub-list-status {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      color: var(--pub-muted);
      font-size: 12px;
      border-top: 1px solid var(--pub-line);
      padding-top: 14px;
    }
    #yc-publication-concept .pub-reset {
      padding: 0;
      border: 0;
      background: none;
      color: var(--pub-accent);
      font-size: 12px;
    }
    #yc-publication-concept h2 {
      font-size: 21px;
      font-weight: 400;
      margin: 26px 0 12px;
    }
    #yc-publication-concept .pub-paper {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      gap: 22px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid var(--pub-line);
      border-radius: 5px;
      background: var(--pub-soft);
    }
    #yc-publication-concept .pub-figure {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #yc-publication-concept .pub-figure img {
      width: 100%;
      height: auto;
      max-height: 138px;
      object-fit: contain;
      background: #fff;
    }
    #yc-publication-concept .pub-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--pub-muted);
      font-size: 12px;
      margin-bottom: 5px;
    }
    #yc-publication-concept .pub-selected-label {
      color: var(--pub-selected-fg);
      background: var(--pub-selected);
      padding: 1px 7px;
      border-radius: 3px;
    }
    #yc-publication-concept h3 {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      margin: 0 0 6px;
    }
    #yc-publication-concept .pub-authors {
      font-size: 13px;
      color: var(--pub-muted);
      margin: 0 0 5px;
    }
    #yc-publication-concept .pub-authors strong {
      color: var(--pub-fg);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #yc-publication-concept .pub-summary {
      margin: 7px 0;
    }
    #yc-publication-concept .pub-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 12px;
      color: var(--pub-muted);
      margin: 6px 0;
    }
    #yc-publication-concept .pub-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 15px;
      margin-top: 10px;
      font-size: 13px;
    }
    #yc-publication-concept details {
      margin-top: 10px;
      font-size: 13px;
    }
    #yc-publication-concept summary {
      color: var(--pub-accent);
      cursor: pointer;
    }
    #yc-publication-concept details p {
      margin: 10px 0 0;
    }
    #yc-publication-concept .pub-empty {
      padding: 30px 0;
      color: var(--pub-muted);
    }
    #yc-publication-concept .pub-footer {
      margin-top: 25px;
      padding-top: 16px;
      border-top: 1px solid var(--pub-line);
      color: var(--pub-muted);
      font-size: 12px;
    }
    #yc-publication-concept[data-treatment="ruled"] .pub-paper {
      padding: 18px 0;
      border-width: 0 0 1px;
      border-radius: 0;
      background: transparent;
    }
    #yc-publication-concept[data-density="compact"] .pub-paper {
      padding-top: 12px;
      padding-bottom: 12px;
      gap: 18px;
      margin-bottom: 6px;
    }
    #yc-publication-concept[data-summaries="false"] .pub-summary {
      display: none;
    }
    #yc-publication-concept [hidden] {
      display: none !important;
    }
    @media (max-width: 600px) {
      #yc-publication-concept .pub-main {
        padding: 25px 18px;
      }
      #yc-publication-concept .pub-nav {
        padding: 15px 18px;
      }
      #yc-publication-concept .pub-nav nav {
        gap: 12px;
      }
      #yc-publication-concept .pub-paper {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      #yc-publication-concept .pub-figure {
        justify-content: start;
      }
      #yc-publication-concept .pub-figure img {
        max-width: 150px;
      }
      #yc-publication-concept input,
      #yc-publication-concept select {
        font-size: 16px;
      }
    }
    @media (pointer: coarse) {
      #yc-publication-concept .pub-chip,
      #yc-publication-concept .pub-reset,
      #yc-publication-concept summary {
        min-height: 44px;
      }
      #yc-publication-concept .pub-actions a {
        padding: 9px 0;
      }
    }
  </style>

        "venue": "Preprint 2026",
        "abstract": "Masked prediction learns by inferring missing variables from visible context. This raises a fundamental question: when does near-optimal conditional prediction determine the joint data law? We study this via an ε-identifiability modulus measuring the largest joint-law error compatible with masked-prediction excess risk at most ε. For slow-mixing data laws with separated global modes, we show that a model can assign substantially incorrect probabilities to entire data regimes while incurring exponentially small excess risk. An exact information decomposition reveals why: for a fixed mask, the prediction loss detects only the portion of the mode-weight mismatch that the visible context leaves unresolved. For small mode-weight perturbations, this sensitivity is proportional to residual mode uncertainty. Once averaged over masks, this residual uncertainty governs the objective's sensitivity to global mode frequencies, with low-visibility masks restoring mode-weight sensitivity and positive full-mask mass providing universal joint-law control under the joint conditional objective. We provide computational and empirical evidence for these predictions through exact calculations, controlled optimization experiments, and measurements on natural text. More broadly, our study suggests that a predictive objective can identify global distinctions only insofar as its conditioning structure leaves them unresolved.",

        "summary": "Why strong pairwise alignment can coexist with a persistent modality gap.",
        "title": "The Geometric Mechanics of Contrastive Representation Learning: Alignment Potentials, Entropic Dispersion, and Cross-Modal Divergence",

        "authors": "Yichao Cai, Zhen Zhang, Yuhang Liu, Javen Q. Shi",
        "venue": "ICML 2026",
        "abstract": "While InfoNCE underlies modern contrastive learning, its geometric mechanisms remain under-characterized beyond the canonical alignment--uniformity decomposition. We develop a measure-theoretic framework in which representation measures evolve on a fixed embedding manifold. In the large-batch limit, we prove value and gradient consistency, linking the stochastic objective to explicit deterministic energy landscapes and revealing a geometric bifurcation between unimodal and symmetric multimodal regimes. In the unimodal case, the intrinsic energy is strictly convex and admits a unique Gibbs equilibrium, showing that entropy acts as a tie-breaker within the aligned basin. In the multimodal case, the intrinsic geometry becomes cross-coupled and contains a persistent negative symmetric divergence term: each modality's marginal reshapes the effective landscape of the other, allowing strong pairwise alignment to coexist with a persistent modality gap. Controlled synthetic experiments and analyses of pretrained CLIP representations support these predictions. Overall, our results shift the analytical lens from pointwise discrimination to population geometry, showing that pairwise alignment alone is insufficient to control cross-modal marginal structure.",

        "venue": "ICML 2026",
        "abstract": "Single-cell perturbation modeling is fundamental for understanding and predicting cellular responses to genetic perturbations. However, existing approaches, from causal representation learning to foundation models, often struggle with an overlooked challenge: gene expression is dominated by perturbation-invariant information, while perturbation-specific signals are intrinsically sparse. As a result, learned representations either entangle invariant and perturbation-specific information, leading to spurious and non-generalizable predictors, or suppress perturbation-specific signals altogether, rendering them ineffective for prediction. To address this, we propose PerturbedVAE, a general framework designed to resolve this signal imbalance. The framework explicitly separates perturbation-specific information from dominant invariant structure and recovers causal representations to effectively utilize such information for prediction. We further provide an identifiability analysis that characterizes the conditions under which sparse perturbation effects can be reliably recovered, thereby clarifying how the framework can be concretely specified under such conditions. Empirically, PerturbedVAE achieves state-of-the-art performance on a widely used benchmark across multiple evaluation settings, yielding significant gains on out-of-distribution combinatorial predictions and uncovering interpretable perturbation-response programs.",

        "summary": "Understanding when cross-modal misalignment can benefit multimodal learning.",
        "title": "On the Value of Cross-Modal Misalignment in Multimodal Representation Learning",
        "year": 2025,
        "authors": "Yichao Cai, Yuhang Liu, Erdun Gao, Tianjiao Jiang, Zhen Zhang, Anton van den Hengel, Javen Q. Shi",
        "venue": "NeurIPS 2025",
        "abstract": "Multimodal representation learning, exemplified by multimodal contrastive learning (MMCL) using image-text pairs, aims to learn powerful representations by aligning cues across modalities. This approach relies on the core assumption that the exemplar image-text pairs constitute two representations of an identical concept. However, recent research has revealed that real-world datasets often exhibit cross-modal misalignment. There are two distinct viewpoints on how to address this issue: one suggests mitigating the misalignment, and the other leveraging it. We seek here to reconcile these seemingly opposing perspectives, and to provide a practical guide for practitioners. Using latent variable models we thus formalize cross-modal misalignment by introducing two specific mechanisms: Selection bias, where some semantic variables are absent in the text, and perturbation bias, where semantic variables are altered -- both leading to misalignment in data pairs. Our theoretical analysis demonstrates that, under mild assumptions, the representations learned by MMCL capture exactly the information related to the subset of the semantic variables invariant to selection and perturbation biases. This provides a unified perspective for understanding misalignment. Based on this, we further offer actionable insights into how misalignment should inform the design of real-world ML systems. We validate our theoretical findings via extensive empirical studies on both synthetic data and real image-text datasets, shedding light on the nuanced impact of cross-modal misalignment on multimodal representation learning.",

  <script>
    (() => {
      const root = document.getElementById("yc-publication-concept");
      const papers = JSON.parse(document.getElementById("yc-publication-data").textContent);
      const search = root.querySelector("input");
      const scope = root.querySelector('[data-field="scope"]');
      const year = root.querySelector('[data-field="year"]');
      const result = root.querySelector(".pub-results");
      const count = root.querySelector("[data-count]");
      const topics = new Set();
      const design = { treatment: "soft", density: "comfortable", summaries: true };
      const escape = (value) =>
        String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      function render() {
        root.dataset.treatment = design.treatment;
        root.dataset.density = design.density;
        root.dataset.summaries = String(design.summaries);
        const words = search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
        const visible = papers.filter(
          (p) =>
            (scope.value !== "selected" || p.selected) &&
            (scope.value !== "preprint" || p.preprint) &&
            (year.value === "all" || String(p.year) === year.value) &&
            (!topics.size || p.topics.some((t) => topics.has(t))) &&
            words.every((w) => [p.title, p.authors, p.venue, p.abstract, p.year, ...p.topics].join(" ").toLowerCase().includes(w))
        );
        root
          .querySelectorAll("[data-topic]")
          .forEach((button) =>
            button.setAttribute("aria-pressed", String(button.dataset.topic === "all" ? !topics.size : topics.has(button.dataset.topic)))
          );
        count.textContent = visible.length + " of " + papers.length + " sample publications";
        let previousYear = "";
        result.innerHTML =
          visible
            .map((p) => {
              const heading = previousYear !== p.year ? "<h2>" + p.year + "</h2>" : "";
              previousYear = p.year;
              const authors = escape(p.authors).replace("Yichao Cai", "<strong>Yichao Cai</strong>");
              const links = [
                ["Paper", p.paper],
                ["Code", p.code],
                ["Project", p.project],
                ["Blog", p.blog],
              ]
                .filter((item) => item[1])
                .map(([label, url]) => '<a href="' + escape(url) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>")
                .join("");
              return (
                heading +
                '<article class="pub-paper"><div class="pub-figure"><img src="' +
                p.image +
                '" alt="Figure from ' +
                escape(p.title) +
                '"></div><div><div class="pub-meta"><span>' +
                escape(p.venue) +
                "</span>" +
                (p.selected ? '<span class="pub-selected-label">Selected</span>' : "") +
                '</div><h3><a href="' +
                escape(p.paper) +
                '" target="_blank" rel="noopener noreferrer">' +
                escape(p.title) +
                '</a></h3><p class="pub-authors">' +
                authors +
                '</p><p class="pub-summary">' +
                escape(p.summary) +
                '</p><div class="pub-tags">' +
                p.topics.map((t) => "<span>" + escape(t) + "</span>").join("") +
                '</div><div class="pub-actions">' +
                links +
                "</div><details><summary>Abstract</summary><p>" +
                escape(p.abstract) +
                "</p></details></div></article>"
              );
            })
            .join("") || '<p class="pub-empty">No matching publications. Try another topic or clear the filters.</p>';
      }
      search.addEventListener("input", render);
      scope.addEventListener("change", render);
      year.addEventListener("change", render);
      root.querySelectorAll("[data-topic]").forEach((button) =>
        button.addEventListener("click", () => {
          const topic = button.dataset.topic;
          if (topic === "all") topics.clear();
          else if (topics.has(topic)) topics.delete(topic);
          else topics.add(topic);
          render();
        })
      );
      root.querySelector(".pub-reset").addEventListener("click", () => {
        search.value = "";
        scope.value = "all";
        year.value = "all";
        topics.clear();
        render();
      });
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(design, "treatment", {
          label: "Publication rows",
          options: [
            { label: "Soft panels", value: "soft" },
            { label: "Simple dividers", value: "ruled" },
          ],
        });
        tweak.addSelect(design, "density", { label: "Spacing", options: ["comfortable", "compact"] });
        tweak.addToggle(design, "summaries", { label: "Show one-line contributions" });
      }
    })();
  </script>
