}

b,

  border-bottom: 1px solid var(--border);

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {

}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align="right"]) {

}

.table :is(.text-center, [align="center"]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)

  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  display: flex;

  gap: 2px;

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

  align-items: center;
  gap: 10px;
}

  align-items: center;
  gap: 4px;
}

  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {

  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);

.viz-badge {

}

.tabular-nums {

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;

  &lt;/style&gt;
  &lt;div class="ag-chrome"&gt;&lt;span&gt;Yichao Cai&lt;/span&gt;&lt;span&gt;Research agenda&lt;/span&gt;&lt;/div&gt;
  &lt;div class="ag-content"&gt;
    &lt;h1&gt;What do learning objectives make representations preserve?&lt;/h1&gt;
    &lt;p class="ag-thesis"&gt;I study what learning objectives identify, what they leave unresolved, and how those limits can guide the design of learning systems.&lt;/p&gt;
    &lt;ol class="ag-framework" aria-label="Shared research framework"&gt;&lt;li&gt;Objective&lt;/li&gt;&lt;li&gt;Structure&lt;/li&gt;&lt;li&gt;Limits&lt;/li&gt;&lt;li&gt;Design&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="ag-choices" role="group" aria-label="Choose a research question"&gt;
      &lt;button class="ag-choice" type="button" data-strand="views" aria-pressed="true" aria-controls="ag-story"&gt;Contrastive learning&lt;span&gt;Shared information &amp;amp; geometry&lt;/span&gt;&lt;/button&gt;
      &lt;button class="ag-choice" type="button" data-strand="masks" aria-pressed="false" aria-controls="ag-story"&gt;Masked prediction&lt;span&gt;Visibility &amp;amp; global structure&lt;/span&gt;&lt;/button&gt;
      &lt;button class="ag-choice" type="button" data-strand="state" aria-pressed="false" aria-controls="ag-story"&gt;Predictive state&lt;span&gt;Concepts &amp;amp; future behavior&lt;/span&gt;&lt;/button&gt;
    &lt;/div&gt;
    &lt;div id="ag-story" aria-live="polite"&gt;
      &lt;p class="ag-kicker" id="ag-topic"&gt;Contrastive learning&lt;/p&gt;
      &lt;h2 id="ag-question"&gt;What survives across views—and how is it organized?&lt;/h2&gt;
      &lt;div class="ag-explanation" id="ag-explanation"&gt;&lt;/div&gt;
      &lt;div class="ag-evidence"&gt;&lt;h3&gt;Work behind this question&lt;/h3&gt;&lt;ul class="ag-papers" id="ag-papers"&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class="ag-next"&gt;&lt;p class="ag-kicker" id="ag-status"&gt;&lt;/p&gt;&lt;h3&gt;Where this leads&lt;/h3&gt;&lt;p id="ag-next"&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class="ag-footer"&gt;&lt;span&gt;Each question brings its own explanation and evidence.&lt;/span&gt;&lt;span&gt;Design concept · proposed wording&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById("agenda-concept");
      const strands = {
        views: {
          topic: "Contrastive learning", question: "What survives across views—and how is it organized?",
          stages: [
            ["Objective", "Construct the views", "Paired modalities and augmentations define which information can be shared."],
            ["Structure", "Identify what survives", "Study recoverable semantic factors and the geometry shaped by contrastive risk."],
            ["Limits", "Explain the mismatch", "Successful pairwise matching can coexist with missing factors or separated modality distributions."],
            ["Design", "Choose supervision deliberately", "Use view construction and pair selection to preserve relevant semantics; evaluate representation geometry as well as retrieval."]
          ],
          papers: [
            ["CLAP", "View construction and content–style invariance.", "https://arxiv.org/abs/2311.16445"],
            ["Cross-modal misalignment", "Which semantics survive imperfect pairing.", "https://arxiv.org/abs/2504.10143"],
            ["Geometric mechanics", "Alignment, dispersion, and modality separation.", "https://arxiv.org/abs/2601.19597"]
          ],
          status: "Open question · proposed framing", next: "How should view and pair design balance semantic recovery with useful representation geometry?"
        },
        masks: {
          topic: "Masked prediction", question: "When does local prediction reveal global structure?",
          stages: [
            ["Objective", "Control what is visible", "A mask schedule determines which variables are observed and which must be predicted."],
            ["Structure", "Ask what can be recovered", "Connect conditional prediction risk to recovery of global distributional information."],
            ["Limits", "Expose mode blindness", "In the studied settings, near-optimal conditional predictions can leave global mode weights unresolved."],
            ["Design", "Make uncertainty informative", "Choose masks that expose the residual uncertainty relevant to the structure or property being recovered."]
          ],
          papers: [["Masked prediction identifiability", "A preprint connecting mask schedules, mode blindness, and global recovery.", "https://arxiv.org/abs/2608.01383"]],
          status: "Future directions · from the existing agenda", next: "Extend the analysis to richer ambiguity regimes, and ask which useful properties remain recoverable when full recovery fails."
        },
        state: {
          topic: "Predictive state", question: "What must a predictor remember about the world?",
          stages: [
            ["Objective", "Predict what comes next", "Next-token prediction rewards representations that support continuation prediction."],
            ["Structure", "Recover meaningful distinctions", "Under explicit assumptions, prediction can recover latent concept posterior structure."],
            ["Limits", "Separate prediction from a world model", "A result for a specified generative process does not establish every form of predictive or action-ready state."],
            ["Design", "Test future use", "The agenda proposes studying which distinctions persist under rollout, compression, and action."]
          ],
          papers: [["I Predict Therefore I Am", "An identifiability result for concept posterior structure.", "https://arxiv.org/abs/2503.08980"]],
          status: "Ongoing project &amp; long-term directions", next: "Study what NTP identifies, then examine finite capacity and precision, and action-conditioned predictive states."
        }
      };
      const state = { strand: "views", layout: "grid", framework: true };
      function render() {
        const data = strands[state.strand];
        root.dataset.layout = state.layout;
        root.querySelector(".ag-framework").hidden = !state.framework;
        root.querySelectorAll("[data-strand]").forEach(button =&gt; button.setAttribute("aria-pressed", String(button.dataset.strand === state.strand)));

        root.querySelector("#ag-question").textContent = data.question;
        root.querySelector("#ag-explanation").innerHTML = data.stages.map((stage, i) =&gt; `&lt;section&gt;&lt;p class="ag-step"&gt;0${i + 1} / ${stage[0]}&lt;/p&gt;&lt;h3&gt;${stage[1]}&lt;/h3&gt;&lt;p&gt;${stage[2]}&lt;/p&gt;&lt;/section&gt;`).join("");
        root.querySelector("#ag-papers").innerHTML = data.papers.map(paper =&gt; `&lt;li&gt;&lt;a href="${paper[2]}" target="_blank" rel="noopener noreferrer"&gt;${paper[0]}&lt;/a&gt;&lt;span&gt;${paper[1]}&lt;/span&gt;&lt;/li&gt;`).join("");
        root.querySelector("#ag-status").textContent = data.status;
        root.querySelector("#ag-next").textContent = data.next;
      }
      root.querySelectorAll("[data-strand]").forEach(button =&gt; button.addEventListener("click", () =&gt; { state.strand = button.dataset.strand; render(); }));
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, "layout", { label: "Explanation layout", options: [{label: "Two columns", value: "grid"}, {label: "Reading sequence", value: "rows"}] });
        tweak.addToggle(state, "framework", { label: "Show shared framework" });
      }
    })();
  &lt;/script&gt;

&lt;script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"&gt;&lt;/script&gt;
&lt;script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(

        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,

        }),

      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
